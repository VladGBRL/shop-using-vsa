<nav class="navbar navbar-expand-lg navbar-dark bg-transparent border-bottom border-secondary border-opacity-10 sticky-top py-3">
  <div class="container">
    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2 fw-bold">
      <i class="bi bi-stars text-info fs-4"></i>
      <span>Quest<span class="text-info">App</span></span>
    </a>

    <button class="navbar-toggler shadow-none border-0" type="button" (click)="isMenuCollapsed = !isMenuCollapsed">
      <i class="bi" [class.bi-list]="isMenuCollapsed" [class.bi-x-lg]="!isMenuCollapsed"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a routerLink="/products" routerLinkActive="active" class="nav-link px-3">Products</a>
        </li>
      </ul>
      
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/cart" class="btn btn-outline-info d-flex align-items-center gap-2 position-relative px-3 rounded-pill">
          <i class="bi bi-cart3"></i>
          <span>Cart</span>
          <span *ngIf="(cartCount$ | async) as count" 
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ count }}
          </span>
        </a>

        <div class="auth-buttons d-flex gap-2 ms-lg-3 ps-lg-3 border-start border-secondary border-opacity-25">
          <ng-container *ngIf="!isLoggedIn">
            <a routerLink="/login" class="nav-link">Login</a>
            <a routerLink="/register" class="btn btn-info text-white fw-semibold px-4 rounded-pill shadow-sm">Sign Up</a>
          </ng-container>
          
          <button *ngIf="isLoggedIn" (click)='logout()' class="btn btn-outline-danger btn-sm px-3 rounded-pill">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
